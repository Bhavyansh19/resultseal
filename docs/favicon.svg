<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Upper Clasp Gradient: Electric Cyan -> Bright Emerald -->
    <linearGradient id="claspGrad1" x1="15%" y1="10%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="40%" stop-color="#00D9F5" />
      <stop offset="100%" stop-color="#007CF0" />
    </linearGradient>

    <!-- Lower Clasp Gradient: Deep Royal Blue -> Vivid Teal -> Mint -->
    <linearGradient id="claspGrad2" x1="85%" y1="90%" x2="10%" y2="20%">
      <stop offset="0%" stop-color="#007CF0" />
      <stop offset="40%" stop-color="#00DFD8" />
      <stop offset="100%" stop-color="#00F5A0" />
    </linearGradient>

    <!-- Inner Stepped Band Gradients -->
    <linearGradient id="innerBandUpper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00DFD8" />
    </linearGradient>

    <linearGradient id="innerBandLower" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#007CF0" />
      <stop offset="100%" stop-color="#0091FF" />
    </linearGradient>

    <!-- Core Diamond Gradient -->
    <linearGradient id="coreDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0FCFF" />
      <stop offset="100%" stop-color="#79FFE1" />
    </linearGradient>
  </defs>

  <!-- The Interlocking Seal System (100% Transparent, No Background) -->
  <g>
    <!-- Outer Clasp 1: Upper Right (Incoming Observation) -->
    <path d="M 80 20
             C 107 20, 129 37, 137 61
             C 139.5 68.5, 136 75.5, 128.5 77
             C 121 78.5, 114 74, 111.5 67
             C 106 51, 94 41, 80 41
             C 68 41, 57 48, 52 59
             L 37 52
             C 45 33, 61 20, 80 20 Z"
          fill="url(#claspGrad1)" />

    <!-- Outer Clasp 2: Lower Left (Verification Contract) -->
    <path d="M 80 140
             C 53 140, 31 123, 23 99
             C 20.5 91.5, 24 84.5, 31.5 83
             C 39 81.5, 46 86, 48.5 93
             C 54 109, 66 119, 80 119
             C 92 119, 103 112, 108 101
             L 123 108
             C 115 127, 99 140, 80 140 Z"
          fill="url(#claspGrad2)" />

    <!-- Inner Stepped Band 1: Upper Emerald Interlock -->
    <path d="M 51 62
             C 53 50, 65 42, 78 44
             L 86 61
             C 75 61, 64 67, 59 75
             Z"
          fill="url(#innerBandUpper)" />

    <!-- Inner Stepped Band 2: Lower Royal Blue Interlock -->
    <path d="M 109 98
             C 107 110, 95 118, 82 116
             L 74 99
             C 85 99, 96 93, 101 85
             Z"
          fill="url(#innerBandLower)" />

    <!-- Precision Sealed Core: Diamond Aperture -->
    <polygon points="80,61 96,80 80,99 64,80"
             fill="url(#coreDiamond)" />

    <!-- Precision Calibration Core Sensor -->
    <circle cx="80" cy="80" r="3.5" fill="#007CF0" />
  </g>
</svg>

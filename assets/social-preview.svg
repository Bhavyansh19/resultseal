<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none">
  <defs>
    <!-- Background Grid Gradient -->
    <radialGradient id="bgGlow" cx="65%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.16" />
      <stop offset="45%" stop-color="#4FACFE" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>

    <!-- Upper Clasp Gradient -->
    <linearGradient id="spUpperClasp" x1="20%" y1="10%" x2="85%" y2="75%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="50%" stop-color="#00D9F5" />
      <stop offset="100%" stop-color="#007CF0" />
    </linearGradient>

    <!-- Lower Clasp Gradient -->
    <linearGradient id="spLowerClasp" x1="80%" y1="90%" x2="15%" y2="25%">
      <stop offset="0%" stop-color="#007CF0" />
      <stop offset="50%" stop-color="#00DFD8" />
      <stop offset="100%" stop-color="#00F5A0" />
    </linearGradient>

    <!-- Inner Core Gradient -->
    <linearGradient id="spCoreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#79FFE1" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="spShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Linear Gradient for Title -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="50%" stop-color="#00D9F5" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Deep Technical Background -->
  <rect width="1280" height="640" fill="#090D16" />
  <rect width="1280" height="640" fill="url(#grid)" />
  <rect width="1280" height="640" fill="url(#bgGlow)" />

  <!-- Left: Content Typography -->
  <g transform="translate(100, 160)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="190" height="34" rx="17" fill="#0E1E2E" stroke="#00D9F5" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="16" cy="17" r="5" fill="#00F5A0" />
    <text x="28" y="22" fill="#00F5A0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">OBSERVATION GATE</text>

    <!-- Main Title -->
    <text x="0" y="96" fill="url(#textGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">ResultSeal</text>

    <!-- High Impact Thesis -->
    <text x="0" y="146" fill="url(#accentGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="0">HTTP 200 is not an observation. Empty is not not-found.</text>

    <!-- Description -->
    <text x="0" y="196" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">Deterministic observation-integrity contracts for AI-agent tool results.</text>
    <text x="0" y="224" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">Guarding MCP, LangChain, Pydantic-AI, CrewAI, and HTTP tool calls.</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 276)">
      <rect x="0" y="0" width="148" height="34" rx="8" fill="#131B2E" stroke="#334155" stroke-width="1" />
      <text x="14" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">🛡️ Fail-Closed Core</text>

      <rect x="160" y="0" width="168" height="34" rx="8" fill="#131B2E" stroke="#334155" stroke-width="1" />
      <text x="14" y="22" transform="translate(160, 0)" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">⚡ Python 3.11+ / PyPI</text>

      <rect x="340" y="0" width="162" height="34" rx="8" fill="#131B2E" stroke="#334155" stroke-width="1" />
      <text x="14" y="22" transform="translate(340, 0)" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">🔒 Zero Dependencies</text>
    </g>
  </g>

  <!-- Right: Hero Vector Interlocking Seal Identity -->
  <g transform="translate(860, 320) scale(2.2)" filter="url(#spShadow)">
    <g transform="translate(-80, -80)">
      <!-- Ambient Seal Light -->
      <circle cx="80" cy="80" r="70" fill="url(#bgGlow)" />

      <!-- Primary Clasp: The Incoming Observation -->
      <path d="M 80 22
               C 105 22, 126 38, 134 60
               C 137 68, 134 76, 125 78
               C 116 80, 110 74, 107 67
               C 102 52, 88 42, 73 44
               C 61 46, 52 54, 48 66
               L 38 60
               C 45 40, 60 22, 80 22 Z"
            fill="url(#spUpperClasp)" />

      <!-- Complementary Clasp: The Verification Contract -->
      <path d="M 80 138
               C 55 138, 34 122, 26 100
               C 23 92, 26 84, 35 82
               C 44 80, 50 86, 53 93
               C 58 108, 72 118, 87 116
               C 99 114, 108 106, 112 94
               L 122 100
               C 115 120, 100 138, 80 138 Z"
            fill="url(#spLowerClasp)" />

      <!-- Upper Anchor Node -->
      <path d="M 52 64
               C 54 52, 66 44, 78 46
               L 86 62
               C 74 62, 64 68, 60 76
               Z"
            fill="#00F5A0" opacity="0.85" />

      <!-- Lower Anchor Node -->
      <path d="M 108 96
               C 106 108, 94 116, 82 114
               L 74 98
               C 86 98, 96 92, 100 84
               Z"
            fill="#007CF0" opacity="0.85" />

      <!-- Sealed Core Aperture -->
      <polygon points="80,62 95,80 80,98 65,80"
               fill="url(#spCoreGlow)" />

      <!-- Micro Calibration Core Center -->
      <circle cx="80" cy="80" r="5" fill="#090D16" />
      <circle cx="80" cy="80" r="2.2" fill="#00F5A0" />

      <!-- Coordinate Accent Markers -->
      <circle cx="80" cy="14" r="2" fill="#00F5A0" opacity="0.7" />
      <circle cx="146" cy="80" r="2" fill="#00D9F5" opacity="0.7" />
      <circle cx="80" cy="146" r="2" fill="#007CF0" opacity="0.7" />
      <circle cx="14" cy="80" r="2" fill="#00DFD8" opacity="0.7" />
    </g>
  </g>
</svg>
